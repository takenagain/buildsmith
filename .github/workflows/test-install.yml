name: Test Install Script

on:
  push:
    branches: [main, dev]
    paths:
      - 'install.sh'
      - 'Makefile'
      - 'scripts/**'
      - 'scripts/test-install-docker.sh'
      - '.github/workflows/test-install.yml'
      - 'runner/**'
  pull_request:
    branches: [main, dev]
    paths:
      - 'install.sh'
      - 'Makefile'
      - 'scripts/**'
      - 'scripts/test-install-docker.sh'
      - '.github/workflows/test-install.yml'
      - 'runner/**'
  workflow_dispatch:

jobs:
  test-install:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            distro: ubuntu
            container: ubuntu:latest
          - os: ubuntu-latest
            distro: debian
            container: debian:latest
          - os: ubuntu-latest
            distro: alpine
            container: alpine:latest
          - os: ubuntu-latest
            distro: arch
            container: archlinux:base
          - os: macos-latest
            distro: macos
            container: ''
    steps:
      - uses: actions/checkout@v7

      - name: Run install.sh
        shell: bash
        run: |
          set -euxo pipefail
          if [ -n "${{ matrix.container }}" ]; then
            if [ "${{ matrix.distro }}" = "alpine" ]; then
              docker run --pull=always --rm -e CI=1 -v "$PWD":/workspace -w /workspace ${{ matrix.container }} sh -euxc '
                apk add --no-cache bash ca-certificates curl && \
                bash ./install.sh && \
                "${CARGO_HOME:-$HOME/.cargo}/bin/rustc" --version && \
                test -x runner/target/release/runner
              '
            elif [ "${{ matrix.distro }}" = "arch" ]; then
              docker run --pull=always --rm -e CI=1 -v "$PWD":/workspace -w /workspace ${{ matrix.container }} bash -euxc '
                pacman-key --init && \
                pacman -Syu --needed --noconfirm bash ca-certificates curl && \
                bash ./install.sh && \
                "${CARGO_HOME:-$HOME/.cargo}/bin/rustc" --version && \
                test -x runner/target/release/runner
              '
            else
              docker run --pull=always --rm -e CI=1 -v "$PWD":/workspace -w /workspace ${{ matrix.container }} bash -euxc '
                apt-get update && apt-get install -y --no-install-recommends bash ca-certificates curl && \
                bash ./install.sh && \
                "${CARGO_HOME:-$HOME/.cargo}/bin/rustc" --version && \
                test -x runner/target/release/runner
              '
            fi
          else
            CI=1 bash ./install.sh
            "${CARGO_HOME:-$HOME/.cargo}/bin/rustc" --version
            test -x runner/target/release/runner
          fi
